<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Formulário de cadastro desenvolvido com HTML5 e CSS3."
    >
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navigation" aria-label="Navegação principal">
            <a href="#inicio">Início</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>

    <main id="inicio" class="main-content">
        <form id="formulario" class="formulario" action="#enviado" method="get">
            <div class="form-header">
                <img
                    src="assets/images/logo.png"
                    alt="Logo do projeto"
                    class="logo"
                >
                <h1>Formulário de Cadastro</h1>
                <p>Preencha os dados abaixo para realizar seu cadastro.</p>
            </div>

            <div class="campo">
                <label for="nome">
                    Nome completo <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Escreva sua resposta aqui"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">
                    E-mail <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Escreva sua resposta aqui"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="nascimento">
                    Data de nascimento <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required
                >
            </div>

            <div class="campo">
                <label for="telefone">
                    Telefone <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="Escreva sua resposta aqui"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">
                    Senha <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Mínimo de 6 caracteres"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="campo">
                <label for="curso">
                    Curso <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <select id="curso" name="curso" required>
                    <option value="">Selecione uma opção</option>
                    <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                    <option value="cc">Ciência da Computação</option>
                    <option value="si">Sistemas de Informação</option>
                </select>
            </div>

            <fieldset class="campo">
                <legend>
                    Turno de preferência
                    <span class="obrigatorio" aria-hidden="true">*</span>
                </legend>

                <label class="resposta">
                    <span>Manhã</span>
                    <input type="radio" name="turno" value="manha" required>
                </label>

                <label class="resposta">
                    <span>Tarde</span>
                    <input type="radio" name="turno" value="tarde">
                </label>

                <label class="resposta">
                    <span>Noite</span>
                    <input type="radio" name="turno" value="noite">
                </label>
            </fieldset>

            <fieldset class="campo">
                <legend>Áreas de interesse</legend>

                <label class="resposta">
                    <span>Front-End</span>
                    <input type="checkbox" name="interesse" value="front">
                </label>

                <label class="resposta">
                    <span>Back-End</span>
                    <input type="checkbox" name="interesse" value="back">
                </label>

                <label class="resposta">
                    <span>Banco de Dados</span>
                    <input type="checkbox" name="interesse" value="banco">
                </label>
            </fieldset>

            <div class="campo">
                <label for="curriculo">
                    Envie seu currículo (PDF)
                    <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input
                    type="file"
                    id="curriculo"
                    name="curriculo"
                    accept=".pdf,application/pdf"
                    required
                >
            </div>

            <div class="campo">
                <label for="porque">Por que deseja se cadastrar?</label>
                <textarea
                    id="porque"
                    name="porque"
                    placeholder="Escreva sua resposta aqui"
                ></textarea>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem adicional</label>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    placeholder="Escreva sua resposta aqui"
                ></textarea>
            </div>

            <fieldset class="campo">
                <legend>
                    Termos de uso
                    <span class="obrigatorio" aria-hidden="true">*</span>
                </legend>

                <label class="termos">
                    <input type="checkbox" name="termos" required>
                    <span>Aceito os termos de uso</span>
                </label>
            </fieldset>

            <button type="submit">Cadastrar</button>
        </form>

        <section id="enviado" class="mensagem-sucesso" aria-live="polite">
            <h2>&#10004; Formulário enviado</h2>
            <p>Seu cadastro foi realizado com sucesso.</p>
        </section>
    </main>

    <footer id="sobre" class="site-footer">
        <p>&copy; 2026 - Projeto de Formulário de Cadastro</p>
    </footer>
</body>
</html>
